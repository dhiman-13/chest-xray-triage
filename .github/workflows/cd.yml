name: CD

# Runs after CI passes on main (or manually): publishes the image to GHCR and redeploys the
# Hugging Face Space. Repo secrets: HF_TOKEN, MONITOR_TOKEN. Repo variables: HF_SPACE, HF_MODEL_REPO.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cxr-triage:latest
            ghcr.io/${{ github.repository_owner }}/cxr-triage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-space:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install huggingface_hub
      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: python deploy/deploy_space.py --space "${{ vars.HF_SPACE }}" --model-repo "${{ vars.HF_MODEL_REPO }}"
      - name: Wait for the live deployment to become healthy
        run: |
          url="https://$(echo '${{ vars.HF_SPACE }}' | tr '/' '-' | tr '[:upper:]_' '[:lower:]-').hf.space/health"
          for i in $(seq 1 30); do
            if curl -fsS "$url"; then exit 0; fi
            sleep 20
          done
          echo "Space did not become healthy within 10 minutes" && exit 1
