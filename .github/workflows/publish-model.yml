name: Publish model

# Publishes the trained model bundle from the Kaggle training run to a public Hugging Face model
# repo. The serving container (Render, see render.yaml) downloads it from there on boot.
# Repo secrets: HF_TOKEN (Hugging Face, write), KAGGLE_API_TOKEN. Repo variables (optional):
# HF_MODEL_REPO (default dhimanjatin/radiassist-model), KAGGLE_KERNEL (default jatin1313/lunglens-cxr-training-t4x2).
# Re-publish by hand from the Actions tab: "Publish model" -> "Run workflow".
on:
  push:
    branches: [lunglens-ui-deploy]
    paths: [deploy/publish_model.py, .github/workflows/publish-model.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-model
  cancel-in-progress: true

env:
  HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO || 'dhimanjatin/radiassist-model' }}
  KAGGLE_KERNEL: ${{ vars.KAGGLE_KERNEL || 'jatin1313/lunglens-cxr-training-t4x2' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install huggingface_hub kaggle

      - name: Check credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          [ -n "$HF_TOKEN" ] || { echo "::error::Repo secret HF_TOKEN is not set"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::Repo secret KAGGLE_API_TOKEN is not set"; exit 1; }
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          who = HfApi().whoami()
          role = who.get("auth", {}).get("accessToken", {}).get("role")
          owner = os.environ["HF_MODEL_REPO"].split("/")[0]
          print(f"::notice title=HF token::belongs to {who['name']}, role {role}")
          if role == "read":
              raise SystemExit("::error::HF_TOKEN is read-only; create a token with Write access")
          if owner != who["name"] and owner not in {o["name"] for o in who.get("orgs", [])}:
              raise SystemExit(f"::error::HF_TOKEN belongs to {who['name']}, which cannot write to {owner}")
          EOF

      - name: Download the trained model bundle from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-out --file-pattern "^cxr-triage/bundle/"
          ls -l kaggle-out/cxr-triage/bundle

      # Errors go to a public annotation: workflow logs need a sign-in to read.
      - name: Publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python deploy/publish_model.py --repo "$HF_MODEL_REPO" --bundle kaggle-out/cxr-triage/bundle 2> >(tee publish.err >&2) || {
            echo "::error title=Publish failed::$(tail -n 6 publish.err | tr '\n' ' ' | cut -c1-900)"; exit 1; }

      - name: Check the model downloads anonymously, as the server will
        run: |
          python - <<'EOF'
          import json, os
          from huggingface_hub import hf_hub_download
          card = json.load(open(hf_hub_download(os.environ["HF_MODEL_REPO"], "model_card.json", token=False)))
          print(f"::notice title=Model published::{os.environ['HF_MODEL_REPO']} version {card['version']}")
          EOF
