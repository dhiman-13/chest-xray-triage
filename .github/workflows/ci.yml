name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check src serving monitoring tests deploy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Unit + API tests
        run: pytest -q
      # End-to-end ML pipeline on synthetic data: proves every stage still works together.
      - name: Pipeline smoke test (data -> train -> evaluate -> export -> register -> serve)
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: |
          python -m cxr.data.synthetic --out data/synthetic --n 400
          python -m cxr.train data=synthetic model=tiny_test train.epochs=2 train.batch_size=32 train.num_workers=0
          python -m cxr.evaluate --n-boot 50 --num-workers 0
          python -m cxr.export --out serving/model_store
          python -m cxr.registry register --bundle serving/model_store
          python -m cxr.registry promote
          python scripts/smoke_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/Dockerfile
          push: false
          tags: cxr-triage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
