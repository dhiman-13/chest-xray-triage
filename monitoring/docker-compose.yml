# Local production-like stack:  API + Prometheus + Grafana
#   cd monitoring && docker compose up --build
#   App http://localhost:8000 · Prometheus http://localhost:9090 · Grafana http://localhost:3000
services:
  api:
    build:
      context: ..
      dockerfile: serving/Dockerfile
    ports: ["8000:7860"]
    environment:
      - HF_MODEL_REPO=${HF_MODEL_REPO:-}
      - MONITOR_TOKEN=${MONITOR_TOKEN:-}
    volumes:
      - ../serving/model_store:/app/serving/model_store
      - api-data:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/cxr.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  api-data:
