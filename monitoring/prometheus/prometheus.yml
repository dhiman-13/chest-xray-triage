global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The container started by docker-compose
  - job_name: cxr-local
    static_configs:
      - targets: ["api:7860"]

  # The public deployment on Hugging Face Spaces (replace with your Space URL)
  - job_name: cxr-hf-space
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["YOUR-HF-USERNAME-lunglens.hf.space"]
